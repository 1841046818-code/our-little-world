server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    root /var/www/little-world;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
