# Include this file inside the HTTPS server block for your app domain.
# It routes the Supabase public APIs through the app domain for networks that
# cannot connect to *.supabase.co directly.

location ^~ /auth/v1/ {
    proxy_pass https://YOUR_PROJECT_ID.supabase.co;
    proxy_set_header Host YOUR_PROJECT_ID.supabase.co;
    proxy_ssl_server_name on;
    proxy_ssl_name YOUR_PROJECT_ID.supabase.co;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
}

location ^~ /rest/v1/ {
    proxy_pass https://YOUR_PROJECT_ID.supabase.co;
    proxy_set_header Host YOUR_PROJECT_ID.supabase.co;
    proxy_ssl_server_name on;
    proxy_ssl_name YOUR_PROJECT_ID.supabase.co;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
}

location ^~ /storage/v1/ {
    client_max_body_size 25m;
    proxy_pass https://YOUR_PROJECT_ID.supabase.co;
    proxy_set_header Host YOUR_PROJECT_ID.supabase.co;
    proxy_ssl_server_name on;
    proxy_ssl_name YOUR_PROJECT_ID.supabase.co;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
}

location ^~ /functions/v1/ {
    proxy_pass https://YOUR_PROJECT_ID.supabase.co;
    proxy_set_header Host YOUR_PROJECT_ID.supabase.co;
    proxy_ssl_server_name on;
    proxy_ssl_name YOUR_PROJECT_ID.supabase.co;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
}

location ^~ /realtime/v1/ {
    proxy_pass https://YOUR_PROJECT_ID.supabase.co;
    proxy_set_header Host YOUR_PROJECT_ID.supabase.co;
    proxy_ssl_server_name on;
    proxy_ssl_name YOUR_PROJECT_ID.supabase.co;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
}
